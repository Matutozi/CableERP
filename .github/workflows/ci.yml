name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/cable_erp

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cable_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Pango (WeasyPrint needs it)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r backend/requirements.txt
      - name: Missing migrations?
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test
        working-directory: backend
      - name: Deployment checklist
        run: python manage.py check --deploy
        working-directory: backend
      - name: Known vulnerabilities
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cable_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      E2E_USERNAME: acmeoaks
      E2E_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Seed and start the stack
        run: |
          python manage.py migrate
          python manage.py seed_data --password "$E2E_PASSWORD"
          python manage.py runserver 127.0.0.1:8000 &
        working-directory: backend
      - name: Start the frontend
        run: |
          npx vite --port 5173 --strictPort &
          timeout 60 bash -c 'until curl -sf http://localhost:5173/api/auth/me/ >/dev/null; do sleep 1; done'
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
