# CableERP web server: serves the built frontend and proxies the API, from one origin.
# deploy/setup.sh installs this, replacing __DOMAIN__, then `certbot --nginx` adds the TLS
# block and the HTTP->HTTPS redirect. HTTPS is not optional: the browser only offers the
# WhatsApp share sheet on a secure origin.

server {
    listen 80;
    server_name __DOMAIN__;

    # The app holds customer prices and bank details: same-origin only, and no framing.
    # 'unsafe-inline' in style-src covers React's style attributes (the colour dots on quote lines).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 4m;   # logo uploads are capped at 2 MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /srv/cableerp/frontend/dist;

    # Hashed assets and the self-hosted font can be cached hard; index.html never.
    location ~ ^/(assets|fonts)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # a large PDF takes a few seconds
    }

    location /static/ {
        alias /srv/cableerp/backend/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /srv/cableerp/backend/media/;
        expires 7d;
    }
}
